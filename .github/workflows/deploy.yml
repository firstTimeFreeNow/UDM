name: Validate and release to GitHub Pages

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact merge commit to release
        type: string
        required: true
      release_version:
        description: Version from RELEASE
        type: string
        required: true
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pages-${{ (github.event_name == 'release' || inputs.release_sha != '') && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && inputs.release_sha == '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test release automation
        run: pnpm run test:release
      - name: Check types
        run: pnpm run typecheck
      - name: Build static site
        run: pnpm run build
      - name: Upload Pages artifact
        if: (github.event_name == 'release' && github.event.action == 'published') || inputs.release_sha != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  publish:
    if: inputs.release_sha != '' && inputs.release_version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: node .github/scripts/release.mjs publish "$RELEASE_VERSION" "$RELEASE_SHA"

  deploy:
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      ((github.event_name == 'release' && github.event.action == 'published') || inputs.release_sha != '')
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
