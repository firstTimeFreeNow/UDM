name: Validate and deploy Go BFF
on:
  push:
    branches: [main]
    paths:
      - 'apps/bff/**'
      - 'tools/cloud-run/**'
      - 'tests/cloud-run/**'
      - '.github/workflows/bff.yml'
      - 'packages/contracts/**'
      - 'tools/contracts/**'
      - 'tools/build.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.tools.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udm-bff-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/bff/go.mod
          cache: false
      - run: go -C apps/bff generate ./internal/adapter/http
      - name: Test concurrent requests
        working-directory: apps/bff
        run: go test -race ./...
      - name: Vet and build
        working-directory: apps/bff
        run: |
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/bff ./cmd/bff
      - name: Validate shell scripts
        run: bash -n tools/cloud-run/bootstrap.sh tools/cloud-run/deploy.sh
      - name: Test deployment scripts without cloud access
        run: python3 -m unittest discover -s tests/cloud-run
      - name: Build runtime container
        run: docker build --file apps/bff/Dockerfile --tag udm-bff:check .
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.UDM_BFF_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build image and deploy Go service
        run: bash tools/cloud-run/deploy.sh
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          UDM_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          UDM_BFF_RUNTIME_SERVICE_ACCOUNT: ${{ vars.UDM_BFF_RUNTIME_SERVICE_ACCOUNT }}
          UDM_BFF_REGION: ${{ vars.UDM_BFF_REGION || 'us-central1' }}
          UDM_ALLOWED_ORIGINS: ${{ vars.UDM_ALLOWED_ORIGINS || 'https://firsttimefreenow.github.io' }}
          UDM_BFF_SHARED_SECRET: ${{ secrets.UDM_BFF_SHARED_SECRET }}
          AF_EXEC_URL: ${{ vars.NEXT_PUBLIC_AF_API_URL }}
