name: Validate and deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps/apps-script/**'
      - 'tools/apps-script/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tests/apps-script/**'
      - '.github/workflows/apps-script.yml'
      - 'tools/contracts/**'
      - 'tools/build.ts'
      - 'tsconfig.tools.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'push: コード反映のみ / deploy: 既存URLの公開版も更新'
        required: true
        type: choice
        default: deploy
        options: [push, deploy]

permissions:
  contents: read

concurrency:
  group: apps-script-afetiria
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      - run: pnpm run typecheck:apps-script
      - run: node .build/tools/apps-script/deploy.js validate
      - run: node --test .build/tests/apps-script/*.test.js

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AF_APPS_SCRIPT_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      - run: pnpm run typecheck:apps-script
      - name: Push source and update existing deployment
        env:
          CLASPRC_JSON: ${{ secrets.AF_CLASPRC_JSON }}
          AF_SCRIPT_ID: ${{ vars.AF_SCRIPT_ID }}
          AF_DEPLOYMENT_ID: ${{ vars.AF_DEPLOYMENT_ID }}
          AF_DEPLOY_MODE: ${{ inputs.mode || vars.AF_APPS_SCRIPT_MODE || 'deploy' }}
        run: node .build/tools/apps-script/deploy.js "$AF_DEPLOY_MODE"
