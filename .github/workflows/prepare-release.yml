name: Create release PR

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
          - hotfix

permissions:
  contents: read

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Create release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: node .github/scripts/release.mjs prepare "$RELEASE_TYPE"
      - name: Show release PR
        env:
          PR_URL: ${{ steps.release.outputs.url }}
        run: |
          printf 'Release PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
