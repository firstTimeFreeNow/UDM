name: Test and build UDM
description: Run tests, type checks, and the static web build without publishing or deploying.
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: apps/bff/go.mod
        cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Test release automation
      shell: bash
      run: pnpm run test:release
    - name: Test equipment planner
      shell: bash
      run: pnpm run test:planner
    - name: Test scheduling API and Apps Script deployment
      shell: bash
      run: pnpm run test:afetiria
    - name: Test Go BFF
      shell: bash
      run: pnpm run test:bff
    - name: Test browser API client and answer drafts
      shell: bash
      run: pnpm run test:api-client
    - name: Check types
      shell: bash
      run: pnpm run typecheck
    - name: Build static site
      env:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
        NEXT_PUBLIC_UDM_API_URL: ${{ vars.NEXT_PUBLIC_UDM_API_URL }}
        NEXT_PUBLIC_AF_API_URL: ${{ vars.NEXT_PUBLIC_AF_API_URL }}
      shell: bash
      run: pnpm run build
