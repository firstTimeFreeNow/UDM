name: Test and build UDM
description: Run tests, type checks, and the static web build without publishing or deploying.
runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v6
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: pnpm
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: apps/bff/go.mod
        cache: false
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Test shared contracts and CI selection
      shell: bash
      run: pnpm run test:contracts && pnpm run test:ci
    - name: Test release automation
      shell: bash
      run: pnpm run test:release
    - name: Test equipment planner
      shell: bash
      run: pnpm run test:planner
    - name: Test scheduling API and Apps Script deployment
      shell: bash
      run: pnpm run test:afetiria
    - name: Test Go BFF
      shell: bash
      run: pnpm run test:bff
    - name: Test browser API client and answer drafts
      shell: bash
      run: pnpm run test:api-client
    - name: Check types
      shell: bash
      run: pnpm run typecheck
    - name: Build static site
      shell: bash
      run: pnpm run build
